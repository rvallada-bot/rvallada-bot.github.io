<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OBDII Dashboard - BLE / SPP</title>
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0e14;
            color: #e0e6ef;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .dashboard {
            max-width: 1300px;
            width: 100%;
            background: #111a24;
            border-radius: 28px;
            padding: 25px 22px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9);
            border: 1px solid #25323f;
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
            gap: 12px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .header-left h1 {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #00d4ff, #3a8cff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 0.5px;
        }

        .badge {
            font-size: 11px;
            background: #1e2a38;
            padding: 4px 12px;
            border-radius: 30px;
            color: #8aa3b8;
            border: 1px solid #2f4052;
            font-weight: 500;
        }

        .connection-status {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #16202b;
            padding: 6px 16px 6px 12px;
            border-radius: 40px;
            border: 1px solid #2a3d4e;
        }

        .led {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #dc3545;
            box-shadow: 0 0 8px #dc3545;
            transition: 0.3s;
            flex-shrink: 0;
        }
        .led.connected {
            background: #28a745;
            box-shadow: 0 0 14px #28a745;
        }
        .led.connecting {
            background: #ffc107;
            box-shadow: 0 0 14px #ffc107;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.85); }
        }

        .status-text {
            font-size: 14px;
            font-weight: 500;
        }

        .status-detail {
            font-size: 12px;
            color: #7a8e9e;
            margin-left: 4px;
        }

        .btn {
            background: #1e2937;
            border: 1px solid #364a5a;
            color: #e0e6ef;
            padding: 7px 20px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: 0.25s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }
        .btn:hover:not(:disabled) {
            background: #2a3a4a;
            border-color: #5a7a9a;
            transform: scale(1.02);
        }
        .btn-primary {
            background: #007bff;
            border-color: #007bff;
            color: #fff;
        }
        .btn-primary:hover:not(:disabled) {
            background: #0069d9;
            border-color: #0069d9;
        }
        .btn-success {
            background: #28a745;
            border-color: #28a745;
            color: #fff;
        }
        .btn-success:hover:not(:disabled) {
            background: #218838;
            border-color: #218838;
        }
        .btn-danger {
            background: #dc3545;
            border-color: #dc3545;
            color: #fff;
        }
        .btn-danger:hover:not(:disabled) {
            background: #c82333;
            border-color: #c82333;
        }
        .btn-warning {
            background: #ffc107;
            border-color: #ffc107;
            color: #1a1a1a;
        }
        .btn-warning:hover:not(:disabled) {
            background: #e0a800;
            border-color: #e0a800;
        }
        .btn:disabled {
            opacity: 0.4;
            pointer-events: none;
            filter: grayscale(0.5);
        }

        .btn-sm {
            padding: 5px 14px;
            font-size: 12px;
        }

        /* ===== AUTO-DETECTION BANNER ===== */
        .detection-banner {
            background: #1a2a3a;
            border: 1px dashed #3a5a7a;
            border-radius: 14px;
            padding: 12px 18px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }

        .detection-banner .info {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
        }

        .detection-banner .info .icon {
            font-size: 22px;
        }

        .detection-banner .status-badge {
            background: #0f1a24;
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 13px;
            border: 1px solid #2a4050;
        }

        /* ===== GAUGES GRID ===== */
        .gauges-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .gauge-card {
            background: #15202b;
            border-radius: 18px;
            padding: 16px 10px 14px;
            text-align: center;
            border: 1px solid #263544;
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.3);
            transition: 0.2s;
        }
        .gauge-card:hover {
            border-color: #3a5a7a;
        }

        .gauge-card .label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #7a92a4;
            font-weight: 600;
        }

        .gauge-card .value {
            font-size: 32px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            line-height: 1.2;
            margin: 2px 0;
        }

        .gauge-card .unit {
            font-size: 14px;
            font-weight: 400;
            color: #7a92a4;
            margin-left: 2px;
        }

        .gauge-bar {
            margin-top: 10px;
            height: 5px;
            background: #1e2e3e;
            border-radius: 10px;
            overflow: hidden;
        }

        .gauge-bar .fill {
            height: 100%;
            width: 0%;
            border-radius: 10px;
            background: linear-gradient(90deg, #00d4ff, #3a8cff);
            transition: width 0.3s ease;
        }

        /* Colores específicos */
        .gauge-card.rpm .value { color: #ff6b6b; }
        .gauge-card.speed .value { color: #4ecdc4; }
        .gauge-card.coolant .value { color: #ffa94d; }
        .gauge-card.throttle .value { color: #a29bfe; }
        .gauge-card.load .value { color: #fd79a8; }
        .gauge-card.fuel .value { color: #55efc4; }

        /* ===== DATA SECTION ===== */
        .data-section {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            margin-top: 6px;
        }

        @media (max-width: 780px) {
            .data-section {
                grid-template-columns: 1fr;
            }
        }

        .table-wrap {
            background: #15202b;
            border-radius: 18px;
            padding: 16px 18px;
            border: 1px solid #263544;
            overflow-x: auto;
        }

        .table-wrap h3 {
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 10px;
            color: #aabbcc;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th {
            text-align: left;
            color: #7a92a4;
            font-weight: 500;
            padding: 5px 4px 10px 4px;
            border-bottom: 1px solid #263544;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        td {
            padding: 7px 4px;
            border-bottom: 1px solid #1a2836;
            font-variant-numeric: tabular-nums;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .log-box {
            background: #15202b;
            border-radius: 18px;
            padding: 16px 18px;
            border: 1px solid #263544;
            max-height: 300px;
            display: flex;
            flex-direction: column;
        }

        .log-box h3 {
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 8px;
            color: #aabbcc;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .log-list {
            flex: 1;
            overflow-y: auto;
            font-size: 13px;
            line-height: 1.6;
            color: #b0c4d8;
            padding-right: 4px;
            font-family: 'Consolas', 'Courier New', monospace;
        }

        .log-list .entry {
            border-bottom: 1px solid #1a2836;
            padding: 3px 0;
            display: flex;
            gap: 8px;
        }

        .log-list .timestamp {
            color: #5a7a8a;
            flex-shrink: 0;
        }

        .log-list .level-info { color: #8ab8d8; }
        .log-list .level-success { color: #55efc4; }
        .log-list .level-warn { color: #fdcb6e; }
        .log-list .level-error { color: #ff6b6b; }

        .log-list::-webkit-scrollbar {
            width: 4px;
        }
        .log-list::-webkit-scrollbar-track {
            background: #0f1820;
        }
        .log-list::-webkit-scrollbar-thumb {
            background: #2f4052;
            border-radius: 8px;
        }

        /* ===== ACTIONS ===== */
        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
            padding-top: 18px;
            border-top: 1px solid #1a2836;
            justify-content: center;
        }

        .actions .btn {
            min-width: 110px;
            justify-content: center;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 600px) {
            .dashboard { padding: 14px 10px; }
            .header-left h1 { font-size: 18px; }
            .gauge-card .value { font-size: 26px; }
            .detection-banner { flex-direction: column; align-items: stretch; }
            .btn { font-size: 12px; padding: 6px 14px; }
            .actions .btn { min-width: 90px; }
        }
    </style>
</head>
<body>

<div class="dashboard" id="app">

    <!-- HEADER -->
    <div class="header">
        <div class="header-left">
            <h1>🚗 OBDII Dashboard</h1>
            <span class="badge" id="modeBadge">🔍 Auto</span>
        </div>
        <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
            <div class="connection-status">
                <span class="led" id="statusLed"></span>
                <span class="status-text" id="statusText">Desconectado</span>
                <span class="status-detail" id="statusDetail"></span>
            </div>
            <button class="btn btn-primary" id="btnConnect">🔗 Conectar</button>
            <button class="btn btn-danger" id="btnDisconnect" disabled>✕ Desconectar</button>
        </div>
    </div>

    <!-- DETECTION BANNER -->
    <div class="detection-banner" id="detectionBanner">
        <div class="info">
            <span class="icon">📡</span>
            <span>Detección automática de protocolo:</span>
            <span class="status-badge" id="detectionStatus">⏳ Esperando conexión...</span>
        </div>
        <div style="display:flex; gap:6px; flex-wrap:wrap;">
            <button class="btn btn-sm btn-warning" id="btnForceBle">🔵 Forzar BLE</button>
            <button class="btn btn-sm" id="btnForceSpp">🔷 Forzar SPP</button>
            <button class="btn btn-sm" id="btnAutoDetect">🔄 Auto</button>
        </div>
    </div>

    <!-- GAUGES -->
    <div class="gauges-grid" id="gaugesContainer"></div>

    <!-- DATA TABLE + LOG -->
    <div class="data-section">
        <div class="table-wrap">
            <h3>📊 Datos OBDII en tiempo real</h3>
            <table>
                <thead>
                    <tr><th>Parámetro</th><th>Valor</th><th>Unidad</th><th>PID</th></tr>
                </thead>
                <tbody id="dataTableBody">
                    <tr><td colspan="4" style="text-align:center; color:#5a7a8a;">Esperando datos...</td></tr>
                </tbody>
            </table>
        </div>
        <div class="log-box">
            <h3>
                📋 Registro
                <span style="font-size:12px; font-weight:400;">
                    <button class="btn btn-sm" id="btnClearLog" style="padding:2px 12px;">🗑 Limpiar</button>
                </span>
            </h3>
            <div class="log-list" id="logList">
                <div class="entry"><span class="timestamp">[--:--:--]</span> <span class="level-info">Dashboard iniciado</span></div>
            </div>
        </div>
    </div>

    <!-- ACTIONS -->
    <div class="actions">
        <button class="btn btn-success" id="btnStartRead" disabled>▶ Iniciar Lectura</button>
        <button class="btn btn-warning" id="btnStopRead" disabled>⏹ Detener</button>
        <button class="btn" id="btnSendCommand">📤 Enviar Comando</button>
        <button class="btn" id="btnScanPids">🔍 Escanear PIDs</button>
        <button class="btn" id="btnExportLog">💾 Exportar Log</button>
    </div>
</div>

<script>
    // ================================================================
    //  CONFIGURACIÓN
    // ================================================================
    // UUIDs para BLE
    const BLE_SERVICE_UUID = '0000fff0-0000-1000-8000-00805f9b34fb';
    const BLE_CHARACTERISTIC_UUID = '0000fff1-0000-1000-8000-00805f9b34fb';
    // UUIDs alternativos comunes
    const BLE_ALT_SERVICES = [
        '000018f0-0000-1000-8000-00805f9b34fb',
        '0000ffe0-0000-1000-8000-00805f9b34fb'
    ];

    // ================================================================
    //  ESTADO
    // ================================================================
    let state = {
        mode: 'auto', // 'auto' | 'ble' | 'spp'
        connected: false,
        connecting: false,
        protocol: null, // 'ble' | 'spp'
        device: null,
        server: null,
        characteristic: null,
        // SPP
        sppSocket: null,
        sppReader: null,
        sppWriter: null,
        // Lectura
        readingInterval: null,
        isReading: false,
        // Datos
        values: {
            rpm: 0, speed: 0, coolant: 0, throttle: 0, load: 0, fuel: 0,
            intake_temp: 0, timing: 0, maf: 0, o2: 0
        },
        pids: {
            rpm: '010C', speed: '010D', coolant: '0105',
            throttle: '0111', load: '0104', fuel: '012F',
            intake_temp: '010F', timing: '010E', maf: '0110', o2: '0114'
        },
        supportedPids: [],
        logEntries: [],
        commandQueue: [],
        processingCommand: false,
    };

    // ================================================================
    //  CONFIGURACIÓN DE GAUGES
    // ================================================================
    const gaugeConfig = [
        { id: 'rpm', label: 'RPM', unit: 'rpm', max: 8000, pid: '010C', color: 'rpm' },
        { id: 'speed', label: 'Velocidad', unit: 'km/h', max: 200, pid: '010D', color: 'speed' },
        { id: 'coolant', label: 'Temp. Refrigerante', unit: '°C', max: 130, pid: '0105', color: 'coolant' },
        { id: 'throttle', label: 'Acelerador', unit: '%', max: 100, pid: '0111', color: 'throttle' },
        { id: 'load', label: 'Carga Motor', unit: '%', max: 100, pid: '0104', color: 'load' },
        { id: 'fuel', label: 'Combustible', unit: '%', max: 100, pid: '012F', color: 'fuel' },
    ];

    // ================================================================
    //  DOM REFS
    // ================================================================
    const $ = (id) => document.getElementById(id);
    const statusLed = $('statusLed');
    const statusText = $('statusText');
    const statusDetail = $('statusDetail');
    const modeBadge = $('modeBadge');
    const detectionStatus = $('detectionStatus');
    const btnConnect = $('btnConnect');
    const btnDisconnect = $('btnDisconnect');
    const btnStartRead = $('btnStartRead');
    const btnStopRead = $('btnStopRead');
    const btnClearLog = $('btnClearLog');
    const btnSendCommand = $('btnSendCommand');
    const btnScanPids = $('btnScanPids');
    const btnExportLog = $('btnExportLog');
    const btnForceBle = $('btnForceBle');
    const btnForceSpp = $('btnForceSpp');
    const btnAutoDetect = $('btnAutoDetect');
    const gaugesContainer = $('gaugesContainer');
    const dataTableBody = $('dataTableBody');
    const logList = $('logList');

    // ================================================================
    //  INICIALIZAR GAUGES
    // ================================================================
    function buildGauges() {
        gaugesContainer.innerHTML = '';
        gaugeConfig.forEach(g => {
            const card = document.createElement('div');
            card.className = `gauge-card ${g.color}`;
            card.id = `gauge-${g.id}`;
            card.innerHTML = `
                <div class="label">${g.label}</div>
                <div class="value" id="val-${g.id}">0<span class="unit">${g.unit}</span></div>
                <div class="gauge-bar"><div class="fill" id="bar-${g.id}"></div></div>
            `;
            gaugesContainer.appendChild(card);
        });
    }
    buildGauges();

    // ================================================================
    //  FUNCIONES UI
    // ================================================================
    function updateGauge(id, value, max) {
        const valEl = document.getElementById(`val-${id}`);
        const barEl = document.getElementById(`bar-${id}`);
        if (!valEl || !barEl) return;
        const num = Number(value) || 0;
        const g = gaugeConfig.find(g => g.id === id);
        valEl.innerHTML = `${num.toFixed(0)}<span class="unit">${g ? g.unit : ''}</span>`;
        const pct = Math.min(100, (num / max) * 100);
        barEl.style.width = `${pct}%`;
    }

    function updateTable() {
        const rows = [
            { label: 'RPM', value: state.values.rpm, unit: 'rpm', pid: state.pids.rpm },
            { label: 'Velocidad', value: state.values.speed, unit: 'km/h', pid: state.pids.speed },
            { label: 'Temp. Refrigerante', value: state.values.coolant, unit: '°C', pid: state.pids.coolant },
            { label: 'Posición Acelerador', value: state.values.throttle, unit: '%', pid: state.pids.throttle },
            { label: 'Carga Motor', value: state.values.load, unit: '%', pid: state.pids.load },
            { label: 'Nivel Combustible', value: state.values.fuel, unit: '%', pid: state.pids.fuel },
        ];
        dataTableBody.innerHTML = rows.map(r =>
            `<tr><td>${r.label}</td><td>${r.value.toFixed(0)}</td><td>${r.unit}</td><td style="color:#5a7a8a;font-size:12px;">${r.pid}</td></tr>`
        ).join('');
    }

    function addLog(message, level = 'info') {
        const time = new Date().toLocaleTimeString();
        state.logEntries.push({ time, message, level });
        const div = document.createElement('div');
        div.className = 'entry';
        div.innerHTML = `<span class="timestamp">[${time}]</span> <span class="level-${level}">${message}</span>`;
        logList.appendChild(div);
        logList.scrollTop = logList.scrollHeight;
        while (logList.children.length > 100) {
            logList.removeChild(logList.firstChild);
        }
    }

    function setStatus(connected, protocol = null, detail = '') {
        state.connected = connected;
        state.protocol = protocol;
        if (connected) {
            statusLed.className = 'led connected';
            statusText.textContent = 'Conectado';
            statusDetail.textContent = protocol ? `(${protocol.toUpperCase()})` : '';
            btnConnect.disabled = true;
            btnDisconnect.disabled = false;
            btnStartRead.disabled = false;
            detectionStatus.textContent = `✅ ${protocol.toUpperCase()} detectado`;
            modeBadge.textContent = protocol ? `📡 ${protocol.toUpperCase()}` : '🔍 Auto';
        } else {
            statusLed.className = 'led';
            statusText.textContent = 'Desconectado';
            statusDetail.textContent = '';
            btnConnect.disabled = false;
            btnDisconnect.disabled = true;
            btnStartRead.disabled = true;
            btnStopRead.disabled = true;
            if (state.readingInterval) {
                clearInterval(state.readingInterval);
                state.readingInterval = null;
                state.isReading = false;
            }
            detectionStatus.textContent = '⏳ Esperando conexión...';
        }
        if (detail) statusDetail.textContent = detail;
    }

    function setConnecting(connecting) {
        state.connecting = connecting;
        if (connecting) {
            statusLed.className = 'led connecting';
            statusText.textContent = 'Conectando...';
            btnConnect.disabled = true;
            detectionStatus.textContent = '🔄 Buscando dispositivo...';
        }
    }

    // ================================================================
    //  PARSEADOR OBDII
    // ================================================================
    function parseObdResponse(data, pid) {
        const bytes = data instanceof ArrayBuffer ? new Uint8Array(data) :
                      data instanceof Uint8Array ? data : new Uint8Array(data);
        const pidLow = parseInt(pid.slice(2), 16);
        const responseByte = 0x41;
        let value = 0;

        // Buscar en la respuesta el PID solicitado
        for (let i = 0; i < bytes.length - 2; i++) {
            if (bytes[i] === responseByte && bytes[i + 1] === pidLow) {
                const a = bytes[i + 2] || 0;
                const b = bytes[i + 3] || 0;
                switch (pid) {
                    case '010C': value = (a * 256 + b) / 4; break;
                    case '010D': value = a; break;
                    case '0105': value = a - 40; break;
                    case '0111': value = (a * 100) / 255; break;
                    case '0104': value = (a * 100) / 255; break;
                    case '012F': value = (a * 100) / 255; break;
                    case '010F': value = a - 40; break; // Intake temp
                    case '010E': value = (a * 256 + b) / 128 - 64; break; // Timing
                    case '0110': value = (a * 256 + b) / 100; break; // MAF
                    case '0114': value = (a * 256 + b) / 200; break; // O2
                    default: value = a;
                }
                return value;
            }
        }
        // Si no encuentra el PID exacto, intenta parsear como respuesta genérica
        if (bytes.length >= 3 && bytes[0] === responseByte) {
            // Algunos adaptadores devuelven directamente el valor
            const a = bytes[2] || 0;
            const b = bytes[3] || 0;
            switch (pid) {
                case '010C': value = (a * 256 + b) / 4; break;
                case '010D': value = a; break;
                case '0105': value = a - 40; break;
                case '0111': value = (a * 100) / 255; break;
                case '0104': value = (a * 100) / 255; break;
                case '012F': value = (a * 100) / 255; break;
                default: value = a;
            }
        }
        return value;
    }

    // ================================================================
    //  FUNCIONES BLE
    // ================================================================
    async function connectBLE() {
        try {
            setConnecting(true);
            addLog('🔍 Buscando dispositivo OBDII BLE...', 'info');

            // Intentar con filtro de servicio principal
            let device = null;
            try {
                device = await navigator.bluetooth.requestDevice({
                    filters: [{ services: [BLE_SERVICE_UUID] }],
                    optionalServices: [BLE_SERVICE_UUID, ...BLE_ALT_SERVICES],
                });
            } catch (e) {
                // Si falla, intentar con todos los dispositivos
                addLog('Buscando con acceptAllDevices...', 'warn');
                device = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: [BLE_SERVICE_UUID, ...BLE_ALT_SERVICES],
                });
            }

            if (!device) {
                addLog('❌ No se seleccionó ningún dispositivo', 'error');
                setStatus(false);
                return false;
            }

            addLog(`📱 Dispositivo: ${device.name || 'Sin nombre'}`, 'info');
            state.device = device;

            const server = await device.gatt.connect();
            state.server = server;
            addLog('✅ Conectado al GATT', 'success');

            // Buscar servicio
            let service;
            try {
                service = await server.getPrimaryService(BLE_SERVICE_UUID);
            } catch (e) {
                // Intentar con servicios alternativos
                for (const alt of BLE_ALT_SERVICES) {
                    try {
                        service = await server.getPrimaryService(alt);
                        addLog(`Servicio encontrado: ${alt}`, 'success');
                        break;
                    } catch (e2) {}
                }
                if (!service) {
                    // Buscar cualquier servicio que parezca OBDII
                    const services = await server.getPrimaryServices();
                    for (const s of services) {
                        const uuid = s.uuid;
                        if (uuid.includes('fff0') || uuid.includes('ffe0') || uuid.includes('18f0')) {
                            service = s;
                            addLog(`Servicio OBDII encontrado: ${uuid}`, 'success');
                            break;
                        }
                    }
                }
                if (!service) throw new Error('No se encontró servicio OBDII');
            }

            // Buscar característica
            let characteristic;
            try {
                characteristic = await service.getCharacteristic(BLE_CHARACTERISTIC_UUID);
            } catch (e) {
                // Buscar cualquier característica de escritura/lectura
                const chars = await service.getCharacteristics();
                for (const c of chars) {
                    if (c.properties.read || c.properties.write || c.properties.writeWithoutResponse) {
                        characteristic = c;
                        addLog(`Característica encontrada: ${c.uuid}`, 'success');
                        break;
                    }
                }
                if (!characteristic) throw new Error('No se encontró característica OBDII');
            }

            state.characteristic = characteristic;

            // Habilitar notificaciones si está disponible
            if (characteristic.properties.notify) {
                await characteristic.startNotifications();
                characteristic.addEventListener('characteristicvaluechanged', (ev) => {
                    const val = ev.target.value;
                    handleNotification(val);
                });
                addLog('🔔 Notificaciones habilitadas', 'info');
            }

            setStatus(true, 'ble');
            addLog('✅ Conectado vía BLE', 'success');
            return true;

        } catch (error) {
            addLog(`❌ Error BLE: ${error.message}`, 'error');
            setStatus(false);
            return false;
        } finally {
            setConnecting(false);
        }
    }

    function handleNotification(data) {
        // Procesar notificaciones automáticas si las hay
        const bytes = new Uint8Array(data.buffer);
        // Intentar parsear como respuesta OBDII
        for (const g of gaugeConfig) {
            const val = parseObdResponse(bytes, g.pid);
            if (val > 0) {
                state.values[g.id] = val;
                updateGauge(g.id, val, g.max);
            }
        }
        updateTable();
    }

    // ================================================================
    //  FUNCIONES SPP (Bluetooth Clásico)
    // ================================================================
    async function connectSPP() {
        try {
            setConnecting(true);
            addLog('🔍 Buscando dispositivo OBDII SPP...', 'info');

            // Usar Web Bluetooth para SPP también (dispositivos con servicio serial)
            const device = await navigator.bluetooth.requestDevice({
                acceptAllDevices: true,
                optionalServices: [
                    '00001101-0000-1000-8000-00805f9b34fb', // Serial SPP
                    '000018f0-0000-1000-8000-00805f9b34fb',
                ],
            });

            if (!device) {
                addLog('❌ No se seleccionó ningún dispositivo', 'error');
                setStatus(false);
                return false;
            }

            state.device = device;
            addLog(`📱 Dispositivo: ${device.name || 'Sin nombre'}`, 'info');

            const server = await device.gatt.connect();
            state.server = server;
            addLog('✅ Conectado al GATT', 'success');

            // Buscar servicio SPP (Serial Port Profile)
            const SPP_UUID = '00001101-0000-1000-8000-00805f9b34fb';
            let service;
            try {
                service = await server.getPrimaryService(SPP_UUID);
            } catch (e) {
                // Buscar cualquier servicio que parezca serial
                const services = await server.getPrimaryServices();
                for (const s of services) {
                    const uuid = s.uuid;
                    if (uuid.includes('1101') || uuid.includes('ffe0') || uuid.includes('18f0')) {
                        service = s;
                        addLog(`Servicio SPP encontrado: ${uuid}`, 'success');
                        break;
                    }
                }
                if (!service) throw new Error('No se encontró servicio SPP');
            }

            // Buscar características para RX/TX
            const chars = await service.getCharacteristics();
            let txChar = null, rxChar = null;
            for (const c of chars) {
                if (c.properties.write || c.properties.writeWithoutResponse) {
                    if (!txChar) txChar = c;
                }
                if (c.properties.read || c.properties.notify) {
                    if (!rxChar) rxChar = c;
                }
            }

            if (!txChar || !rxChar) {
                // Usar la misma para todo
                txChar = chars[0];
                rxChar = chars[0];
            }

            state.characteristic = txChar; // Para escritura
            // Guardar también la de lectura
            state.sppReader = rxChar;

            if (rxChar.properties.notify) {
                await rxChar.startNotifications();
                rxChar.addEventListener('characteristicvaluechanged', (ev) => {
                    const val = ev.target.value;
                    handleNotification(val);
                });
                addLog('🔔 Notificaciones SPP habilitadas', 'info');
            }

            setStatus(true, 'spp');
            addLog('✅ Conectado vía SPP (Bluetooth Clásico)', 'success');
            return true;

        } catch (error) {
            addLog(`❌ Error SPP: ${error.message}`, 'error');
            setStatus(false);
            return false;
        } finally {
            setConnecting(false);
        }
    }

    // ================================================================
    //  DETECCIÓN AUTOMÁTICA
    // ================================================================
    async function autoDetect() {
        if (state.connected) {
            addLog('⚠️ Ya estás conectado. Desconecta primero.', 'warn');
            return;
        }

        addLog('🔍 Iniciando detección automática de protocolo...', 'info');
        setConnecting(true);
        detectionStatus.textContent = '🔄 Probando BLE...';

        // Primero intentar BLE
        let success = await connectBLE();
        if (success) {
            state.mode = 'ble';
            modeBadge.textContent = '📡 BLE (Auto)';
            detectionStatus.textContent = '✅ BLE detectado';
            return;
        }

        // Si BLE falla, intentar SPP
        addLog('🔄 BLE no disponible, probando SPP...', 'warn');
        detectionStatus.textContent = '🔄 Probando SPP...';
        success = await connectSPP();
        if (success) {
            state.mode = 'spp';
            modeBadge.textContent = '📡 SPP (Auto)';
            detectionStatus.textContent = '✅ SPP detectado';
            return;
        }

        // Ambos fallaron
        addLog('❌ No se pudo conectar con ningún protocolo', 'error');
        detectionStatus.textContent = '❌ No se detectó adaptador OBDII';
        setStatus(false);
        setConnecting(false);
    }

    // ================================================================
    //  COMANDOS OBDII
    // ================================================================
    async function sendObdCommand(cmd) {
        if (!state.connected || !state.characteristic) {
            addLog('❌ No conectado', 'error');
            return null;
        }

        try {
            const encoder = new TextEncoder();
            const cmdWithCR = cmd.endsWith('\r') ? cmd : cmd + '\r';
            await state.characteristic.writeValue(encoder.encode(cmdWithCR));
            addLog(`📤 Enviado: ${cmd}`, 'info');

            // Esperar respuesta
            let response = null;
            if (state.sppReader && state.sppReader.properties.read) {
                // Para SPP, leer respuesta
                response = await state.sppReader.readValue();
            } else if (state.characteristic.properties.read) {
                response = await state.characteristic.readValue();
            } else {
                // Si no se puede leer, esperar notificación
                await new Promise(resolve => setTimeout(resolve, 300));
                return null;
            }

            if (response) {
                const bytes = new Uint8Array(response.buffer);
                const hexStr = Array.from(bytes).map(b => b.toString(16).padStart(2, '0')).join(' ');
                addLog(`📥 Respuesta: ${hexStr}`, 'info');
                return response;
            }
            return null;
        } catch (e) {
            addLog(`❌ Error enviando comando: ${e.message}`, 'error');
            return null;
        }
    }

    // ================================================================
    //  LECTURA DE DATOS
    // ================================================================
    async function readAllData() {
        if (!state.connected) return;

        for (const g of gaugeConfig) {
            try {
                const response = await sendObdCommand(g.pid);
                if (response) {
                    const val = parseObdResponse(response.buffer, g.pid);
                    if (val >= 0) {
                        state.values[g.id] = val;
                        updateGauge(g.id, val, g.max);
                    }
                }
            } catch (e) {
                // Silencioso
            }
        }
        updateTable();
    }

    // ================================================================
    //  ESCANEAR PIDs
    // ================================================================
    async function scanPids() {
        if (!state.connected) {
            addLog('❌ Conecta primero', 'error');
            return;
        }

        addLog('🔍 Escaneando PIDs soportados...', 'info');
        const pidsToTest = ['0100', '0101', '0120', '0140'];
        const supported = [];

        for (const pid of pidsToTest) {
            const response = await sendObdCommand(pid);
            if (response) {
                const bytes = new Uint8Array(response.buffer);
                // Verificar si hay datos válidos
                if (bytes.length > 3 && bytes[0] === 0x41) {
                    supported.push(pid);
                    addLog(`✅ PID ${pid} soportado`, 'success');
                }
            }
            // Pequeña pausa entre comandos
            await new Promise(r => setTimeout(r, 100));
        }

        state.supportedPids = supported;
        addLog(`🔍 Escaneo completado. ${supported.length} PIDs encontrados.`, 'info');
        return supported;
    }

    // ================================================================
    //  EXPORTAR LOG
    // ================================================================
    function exportLog() {
        const content = state.logEntries.map(e => `[${e.time}] ${e.message}`).join('\n');
        const blob = new Blob([content], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `obdii_log_${new Date().toISOString().slice(0,10)}.txt`;
        a.click();
        URL.revokeObjectURL(url);
        addLog('💾 Log exportado', 'success');
    }

    // ================================================================
    //  DESCONEXIÓN
    // ================================================================
    function disconnect() {
        if (state.readingInterval) {
            clearInterval(state.readingInterval);
            state.readingInterval = null;
            state.isReading = false;
            btnStartRead.disabled = false;
            btnStopRead.disabled = true;
        }

        if (state.device && state.device.gatt) {
            try {
                state.device.gatt.disconnect();
                addLog('🔌 Desconectado', 'info');
            } catch (e) {
                addLog(`Error al desconectar: ${e.message}`, 'warn');
            }
        }

        state.device = null;
        state.server = null;
        state.characteristic = null;
        state.sppReader = null;
        state.sppWriter = null;

        // Reiniciar valores
        gaugeConfig.forEach(g => {
            state.values[g.id] = 0;
            updateGauge(g.id, 0, g.max);
        });
        updateTable();
        setStatus(false);
        modeBadge.textContent = '🔍 Auto';
        detectionStatus.textContent = '⏳ Desconectado';
    }

    // ================================================================
    //  EVENTOS
    // ================================================================
    btnConnect.addEventListener('click', autoDetect);

    btnDisconnect.addEventListener('click', disconnect);

    btnStartRead.addEventListener('click', () => {
        if (!state.connected) {
            addLog('❌ No conectado', 'error');
            return;
        }
        if (state.isReading) return;
        state.isReading = true;
        btnStartRead.disabled = true;
        btnStopRead.disabled = false;
        state.readingInterval = setInterval(async () => {
            await readAllData();
        }, 500);
        addLog('▶ Lectura iniciada (cada 500ms)', 'success');
    });

    btnStopRead.addEventListener('click', () => {
        if (state.readingInterval) {
            clearInterval(state.readingInterval);
            state.readingInterval = null;
            state.isReading = false;
            btnStartRead.disabled = false;
            btnStopRead.disabled = true;
            addLog('⏹ Lectura detenida', 'info');
        }
    });

    btnClearLog.addEventListener('click', () => {
        logList.innerHTML = '';
        state.logEntries = [];
        addLog('🗑 Log limpiado', 'info');
    });

    btnSendCommand.addEventListener('click', async () => {
        if (!state.connected) {
            addLog('❌ No conectado', 'error');
            return;
        }
        const cmd = prompt('Ingresa comando OBDII (ej: 0100, 010C, ATZ):');
        if (!cmd) return;
        await sendObdCommand(cmd);
    });

    btnScanPids.addEventListener('click', scanPids);

    btnExportLog.addEventListener('click', exportLog);

    btnForceBle.addEventListener('click', async () => {
        if (state.connected) disconnect();
        state.mode = 'ble';
        modeBadge.textContent = '📡 BLE (Forzado)';
        detectionStatus.textContent = '🔄 Forzando BLE...';
        await connectBLE();
        if (!state.connected) {
            detectionStatus.textContent = '❌ BLE falló';
        }
    });

    btnForceSpp.addEventListener('click', async () => {
        if (state.connected) disconnect();
        state.mode = 'spp';
        modeBadge.textContent = '📡 SPP (Forzado)';
        detectionStatus.textContent = '🔄 Forzando SPP...';
        await connectSPP();
        if (!state.connected) {
            detectionStatus.textContent = '❌ SPP falló';
        }
    });

    btnAutoDetect.addEventListener('click', async () => {
        if (state.connected) disconnect();
        state.mode = 'auto';
        modeBadge.textContent = '🔍 Auto';
        await autoDetect();
    });

    // ================================================================
    //  INICIALIZACIÓN
    // ================================================================
    setStatus(false);
    addLog('🚗 Dashboard OBDII iniciado - Detección automática BLE/SPP', 'info');
    addLog('💡 Presiona "Conectar" para buscar automáticamente', 'info');

    if (!navigator.bluetooth) {
        addLog('❌ Este navegador no soporta Web Bluetooth', 'error');
        btnConnect.disabled = true;
        detectionStatus.textContent = '❌ Navegador no compatible';
    }

    // Manejar desconexión inesperada
    if (navigator.bluetooth) {
        navigator.bluetooth.addEventListener('availabilitychanged', (event) => {
            if (!event.value && state.connected) {
                addLog('⚠️ Bluetooth desactivado', 'warn');
                disconnect();
            }
        });
    }

    console.log('OBDII Dashboard con detección automática BLE/SPP cargado');
</script>
